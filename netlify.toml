[build]
  command = "npm run build"
  publish = "_site"

[build.environment]
  NODE_VERSION = "24"

# Legacy public URLs. Keep these explicit: the old root routes no longer match
# the current directory structure, and force=true prevents generated .html
# files from shadowing their clean canonical redirects.

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

